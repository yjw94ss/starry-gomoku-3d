<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#b9e2f7" />
<meta name="description" content="星星五子棋：一个用 three.js 做的 3D 五子棋小游戏，规则简单，适合小朋友玩。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23ff8a3d'/%3E%3Ctext x='50' y='74' font-size='66' text-anchor='middle' fill='%23ffffff'%3E%E2%98%85%3C/text%3E%3C/svg%3E" />
<title>星星五子棋 · 3D 小游戏</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="ui">
  <header class="top">
    <div class="brand">
      <span class="logo">★</span>
      <div>
        <h1>星星五子棋</h1>
        <p>五颗同色连成一条线，就赢啦</p>
      </div>
    </div>
    <div class="right">
      <div class="modes" id="modes">
        <button data-mode="ai" data-level="easy" class="on">简单</button>
        <button data-mode="ai" data-level="normal">普通</button>
        <button data-mode="pvp">双人</button>
      </div>
      <button class="icon" id="btnSound" aria-label="关闭音效">♪</button>
    </div>
  </header>

  <div class="hint" id="hint">拖动可旋转视角 · 滚轮 / 双指缩放</div>

  <footer class="bottom">
    <div class="turn"><i class="dot black" id="turnDot"></i><span id="turnText">轮到 小黑 落子</span></div>
    <div class="actions">
      <button id="btnUndo">悔棋</button>
      <button id="btnRestart">重开一局</button>
    </div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="stars"><span>★</span><span>★</span><span>★</span></div>
    <h2 id="ovTitle">小黑赢啦！</h2>
    <p id="ovSub">五颗棋子连成了一条线，真棒！</p>
    <button class="cta small" id="ovAgain">再来一局</button>
  </div>
</div>

<div id="start">
  <div class="start-inner">
    <div class="logo-big">★</div>
    <h1>星星五子棋</h1>
    <p class="sub">3D 小棋盘 · 五颗连成一条线就赢</p>
    <div class="stone-row"><i class="s b"></i><i class="s w"></i><i class="s b"></i><i class="s w"></i><i class="s b"></i></div>
    <button class="cta" id="startBtn">开始玩</button>
    <p class="tip">双人同屏 · 或和电脑对弈</p>
  </div>
</div>

<script>
/*__THREE__*/
</script>
<script>
/*__LOGIC__*/
</script>
<script>
/*__SCENE__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
